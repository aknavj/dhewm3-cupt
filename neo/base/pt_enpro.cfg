// Opt-in Enpro lighting/look profile: exec pt_enpro.cfg
// Load the test map separately with: map game/enpro
// Reference viewpoint: setviewpos -1177.94 3760.25 -155.75 131.5

seta r_ptDraw "1"
seta r_ptMode "0"
seta r_ptPreset "high"
seta r_ptAccumulation "1"
seta r_ptResetOnSceneChange "1"

// Lift the existing practical lights and their bounce lighting, not the gamma.
set r_lightScale "2.2"
seta r_ptExposure "2.2"
seta r_ptEmissionBoost "2"
seta r_ptSpecularBoost "1"
seta r_ptSoftShadowScale "0.25"
seta r_ptToneMapMode "1"
seta r_ptGamma "2.2"

// Keep dim indirect paths less noisy and leave room for brighter highlights.
seta r_ptRussianRoulette "1"
seta r_ptRRMinBounces "3"
seta r_ptRRSurvivalMin "0.1"
seta r_ptEarlyTermThreshold "0.01"
seta r_ptThroughputClamp "0.05"
seta r_ptFireflyClamp "8"
seta r_ptDenoise "1"
seta r_ptDenoiseStrength "0.5"

// A visible sky is not an environment light. Keep Enpro's interior clear.
seta r_ptSkyIntensity "0"
seta r_ptVolumetric "0"
seta r_ptVolumetricDensity "0"

echo "Enpro PT look applied. Load with: map game/enpro"
